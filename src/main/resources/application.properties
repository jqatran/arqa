spring.application.name=arqa

# Database: file-based H2, survives restarts. Override with SPRING_DATASOURCE_URL if needed.
spring.datasource.url=jdbc:h2:file:./data/arqa
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Keep the UTC offset written in the incoming JSON: the driver's day is decided by it.
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
# Money must be written as a whole number: reject 1.5 (no silent truncation) and "2400" (a string is not a number).
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

# Trips from this file are loaded on startup through the same validated, idempotent path as POST /api/trips.
arqa.seed.enabled=true
arqa.seed.resource=classpath:seed/trips.json

# Translations of API messages: messages.properties (English, default), messages_ru, messages_kk.
# An unsupported language falls back to English, never to the server's own locale.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
